name: Build de_draw
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target DeDraw_VST3 --parallel
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Make installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\de_draw.iss'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: de_draw_installer
          path: installer/output/de_draw_setup.exe
      - name: Upload plain VST3
        uses: actions/upload-artifact@v4
        with:
          name: de_draw_vst3_folder
          path: build/DeDraw_artefacts/Release/VST3/de_draw.vst3
